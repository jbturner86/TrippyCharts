<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrippyCharts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height:100%; color:#f4ecff; font-family:"Trebuchet MS","Segoe UI",sans-serif; background:#07010e; overflow:hidden; cursor:crosshair; }
    button, select, .chip, input { cursor:pointer; }
    #sky { position:fixed; inset:0; z-index:0; pointer-events:none;
      background: radial-gradient(ellipse at 12% 8%, rgba(255,60,180,.16), transparent 40%),
                  linear-gradient(180deg,#12061c 0%,#07010e 60%,#0b0714 100%); }
    #sky canvas { width:100%; height:100%; display:block; }
    .wrap { position:relative; z-index:1; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    header { text-align:center; padding:10px 12px 6px; }
    h1 { font-size:clamp(1.25rem,3vw,2.15rem); letter-spacing:.16em; text-transform:uppercase; font-weight:900;
      font-family:Impact,"Arial Black","Trebuchet MS",sans-serif;
      background:linear-gradient(90deg,#7cff3a,#fff,#c44bff,#ff5d8f); background-size:220% auto;
      -webkit-background-clip:text; background-clip:text; color:transparent; animation:sheen 7s linear infinite;
      -webkit-text-stroke:1.4px rgba(255,255,255,.28); filter:drop-shadow(0 0 8px rgba(196,75,255,.55)); }
    @keyframes sheen { to { background-position:220% center; } }
    .status { margin-top:4px; color:#cbb6ff; font-size:.8rem; }
    .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:8px 0 10px; align-items:center; }
    button { background:rgba(255,255,255,.06); color:#efe6ff; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:6px 11px; letter-spacing:.08em; text-transform:uppercase; font-size:.65rem; }
    .density-box, .xp-box { position:fixed; top:10px; z-index:6; width:220px; padding:8px 10px; border-radius:12px; background:rgba(18,8,28,.72); }
    .density-box { left:12px; border:1px solid rgba(255,160,60,.55); }
    .xp-box { right:12px; border:1px solid rgba(120,255,180,.55); }
    .density-box label, .xp-box label { display:block; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
    .density-box label { color:#ffd39a; } .xp-box label { color:#b8ffd4; }
    .density-box input { width:100%; accent-color:#ff9a3a; }
    .xp-track { height:10px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; }
    .xp-fill { height:100%; width:0%; background:linear-gradient(90deg,#7cff3a,#3affc8,#c44bff); }
    body.zen .density-box { display:none; }
    .board { flex:1 1 auto; min-height:0; display:grid; grid-template-columns: auto minmax(0,1fr) auto; gap:6px; padding:0 4px 8px; }
    .toys-col { display:flex; flex-direction:column; justify-content:space-evenly; gap:6px; width:max-content; }
    .toys-left { align-items:flex-end; } .toys-right { align-items:flex-start; }
    body.zen header, body.zen .stage { display:none !important; }
    body.zen .actions { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:5; }
    body.corner .stage { position:fixed; right:8px; bottom:8px; width:min(420px,46vw); height:min(280px,34vh); z-index:4; gap:6px; }
    body.corner .card canvas { min-height:70px; }
    body.corner .group-name { font-size:.7rem; }
    body.corner .pickers { display:none; }
    .chip { display:inline-flex; width:max-content; align-items:center; gap:6px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:5px 10px; font-size:.72rem; white-space:nowrap; }
    .chip.locked { color:transparent; border:0; background:linear-gradient(135deg,#7cff3a,#3ae8ff,#c44bff,#ff5d8f,#ffe14a,#7cff3a); background-size:220% 220%; animation:lockPulse 2.4s linear infinite; box-shadow:0 0 12px rgba(196,75,255,.55); }
    .chip.locked span { visibility:hidden; }
    @keyframes lockPulse { to { background-position:220% 0; } }
    .chip input { width:15px; height:15px; accent-color:#c44bff; }
    .stage { min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; width:100%; height:100%; }
    .card { min-height:0; border-radius:16px; background:rgba(10,6,20,.46); border:1px solid rgba(255,255,255,.14); display:flex; flex-direction:column; }
    .card canvas { display:block; width:100%; flex:1 1 auto; min-height:0; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:space-between; padding:7px 9px 9px; }
    .group-name { font-size:1rem; letter-spacing:.08em; text-transform:uppercase; color:#efe6ff; margin-bottom:5px; font-weight:700; }
    .pickers { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    select { padding:5px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(18,8,28,.92); color:#fff; font-size:.75rem; }
    .px { font-variant-numeric:tabular-nums; font-size:.92rem; }
    .chg.up { color:#7cff3a; } .chg.down { color:#ff5d8f; } .chg.flat { color:#d7c7ff; }
    .note { font-size:.62rem; color:#b9a6dd; }
    @media (max-width:900px) {
      html,body { overflow:auto; cursor:auto; }
      .wrap { height:auto; min-height:100dvh; overflow:visible; }
      .board { display:flex; flex-direction:column; height:auto; }
      .toys-col { flex-direction:row; flex-wrap:wrap; justify-content:center; }
      .stage { grid-template-columns:1fr; height:auto; }
      .card canvas { height:230px; flex:none; }
      .density-box, .xp-box { position:static; width:min(220px,90%); margin:8px auto 0; }
    }
  </style>
</head>
<body>
  <div id="sky"><canvas id="bg"></canvas></div>
  <div class="wrap">
    <header><h1>TrippyCharts</h1><p class="status" id="status"></p></header>
    <div class="density-box">
      <label for="density">toy density <span id="densityVal">70</span></label>
      <input type="range" id="density" min="0" max="400" value="70">
    </div>
    <div class="xp-box">
      <label>xp lvl <span id="lvlVal">1</span> — <span id="xpVal">0</span>%</label>
      <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <div class="actions">
      <button type="button" id="fullscreen">page full screen</button>
      <button type="button" id="corner">charts corner</button>
      <button type="button" id="zen">hide everything</button>
    </div>
    <div class="board center" id="board">
      <div class="toys-col toys-left" id="toysLeft"></div>
      <main class="stage" id="grid"></main>
      <div class="toys-col toys-right" id="toysRight"></div>
    </div>
  </div>
<script>
const TOYS = [
  ["mushrooms","Mushrooms"],["stars","Stars"],["moons","Moons"],["turtles","Turtles"],
  ["skulls","Skulls"],["hearts","Hearts"],["flowers","Flowers"],["butterflies","Butterflies"],
  ["aliens","Aliens"],["frogs","Frogs"],["cats","Cats"],["crystals","Crystals"],
  ["planets","Planets"],["clouds","Clouds"],["dice","Dice"],["peace","Peace signs"],["sparkles","Sparkles"]
];
const TFS = [
  {id:"1m",interval:"1m",range:"1d"},{id:"5m",interval:"5m",range:"5d"},{id:"10m",interval:"5m",range:"5d",group:2},
  {id:"15m",interval:"15m",range:"5d"},{id:"30m",interval:"30m",range:"5d"},{id:"1h",interval:"60m",range:"1mo"},
  {id:"2h",interval:"60m",range:"3mo",group:2},{id:"4h",interval:"60m",range:"3mo",group:4},
  {id:"1d",interval:"1d",range:"6mo"},{id:"1w",interval:"1wk",range:"2y"}
];
const GROUPS = [
  {title:"Magnificent 7 / Mega-cap Tech", names:[["NVDA","Nvidia"],["AAPL","Apple"],["MSFT","Microsoft"],["AMZN","Amazon"],["GOOGL","Alphabet"],["META","Meta"],["TSLA","Tesla"]]},
  {title:"Semis & AI Infrastructure", names:[["AVGO","Broadcom"],["AMD","AMD"],["MU","Micron"],["INTC","Intel"],["PLTR","Palantir"],["TSM","TSMC"],["AMAT","Applied Materials"]]},
  {title:"Financials", names:[["JPM","JPMorgan"],["BAC","Bank of America"],["V","Visa"],["MA","Mastercard"],["WFC","Wells Fargo"],["GS","Goldman Sachs"],["MS","Morgan Stanley"],["BLK","BlackRock"],["SCHW","Charles Schwab"],["C","Citigroup"]]},
  {title:"Healthcare", names:[["UNH","UnitedHealth"],["LLY","Eli Lilly"],["JNJ","Johnson & Johnson"],["ABBV","AbbVie"],["MRK","Merck"],["PFE","Pfizer"],["ABT","Abbott"],["TMO","Thermo Fisher"],["AMGN","Amgen"],["ISRG","Intuitive Surgical"]]}
];
let unlocked = Math.max(1, Math.min(TOYS.length, +(localStorage.getItem("tc_unlocked")||1)));
let xp = Math.max(0, Math.min(99, +(localStorage.getItem("tc_xp")||0)));
function saveProg(){ localStorage.setItem("tc_unlocked", unlocked); localStorage.setItem("tc_xp", xp); }
function paintXP(){
  document.getElementById("xpVal").textContent = xp;
  document.getElementById("lvlVal").textContent = unlocked;
  document.getElementById("xpFill").style.width = xp + "%";
}
function gainXP(n){
  xp += n;
  while (xp >= 100) { xp -= 100; if (unlocked < TOYS.length) { unlocked += 1; renderToys(); } }
  saveProg(); paintXP();
}
function renderToys(){
  const mid = Math.ceil(TOYS.length/2);
  const html = (slice, start) => slice.map(([id,label], i) => {
    const idx = start + i;
    if (idx >= unlocked) return `<span class="chip locked" title="locked"><span>${label}</span></span>`;
    const checked = id==="mushrooms" || document.querySelector(`[data-toy="${id}"]:checked`);
    return `<label class="chip"><input type="checkbox" data-toy="${id}" ${checked?"checked":""}>${label}</label>`;
  }).join("");
  document.getElementById("toysLeft").innerHTML = html(TOYS.slice(0,mid), 0);
  document.getElementById("toysRight").innerHTML = html(TOYS.slice(mid), mid);
}
renderToys(); paintXP();
function activeToys(){ return [...document.querySelectorAll("[data-toy]:checked")].map(el => el.dataset.toy); }
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
document.getElementById("board").addEventListener("change", () => { const kinds = activeToys(); bits.forEach(b => { if (kinds.length) b.kind = pick(kinds); }); });
const mouse = { x: innerWidth/2, y: innerHeight/2, px: innerWidth/2, py: innerHeight/2 };
addEventListener("mousemove", e => { mouse.px = mouse.x; mouse.py = mouse.y; mouse.x = e.clientX; mouse.y = e.clientY; });
const bg = document.getElementById("bg"), ctx = bg.getContext("2d");
let bits = [], burst = [], step = 0, jetAng = 0, eaten = 0, squidScale = 0.65, zenMode = false, boss = null, novaFX = 0, fightStarted = 0;
const SQUID_START = 0.65, SQUID_MAX = 1.15, ARM_N = 16, SEG = 16;
const squid = Array.from({length: ARM_N}, () => Array.from({length: SEG}, (_,i) => ({ x: innerWidth/2, y: innerHeight/2, r: Math.max(1.4, 6.5 - i*0.28) })));
function resizeBg(){ bg.width = innerWidth; bg.height = innerHeight; }
addEventListener("resize", resizeBg); resizeBg();
function nova(){ for (let i=0;i<120;i++){ const a=Math.random()*Math.PI*2, sp=3+Math.random()*14; burst.push({ x:mouse.x, y:mouse.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, hue:Math.random()*360, r:2+Math.random()*6 }); } eaten=0; squidScale=SQUID_START; }
function growFromEat(){ eaten++; if (eaten>0 && eaten%15===0){ squidScale=Math.min(SQUID_MAX, squidScale*1.05); if (squidScale>=SQUID_MAX) nova(); } }
function spawnBoss(phase){
  boss = { kind:"mushrooms", phase, nasty:phase>=2, x:innerWidth*0.5, y:innerHeight*0.38, s:phase===1?170:phase===2?260:320, hp:100, maxHp:100, rot:0, spin:phase===1?.02:.08, hue:phase===1?120:phase===2?12:280, hurt:0 };
  fightStarted = performance.now();
}
function endZenAfterNova(){ zenMode=false; boss=null; novaFX=0; document.body.classList.remove("zen"); document.getElementById("zen").textContent="hide everything"; }
function startSuperNova(x,y){ novaFX=1; for(let i=0;i<280;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*22; burst.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:Math.random()*360,r:3+Math.random()*14}); } setTimeout(endZenAfterNova,1700); }
function hitBoss(b){
  if(!boss) return false;
  if(Math.hypot(b.x-boss.x,b.y-boss.y)>=boss.s*0.48) return false;
  boss.hp=Math.max(0,boss.hp-2); boss.hurt=8;
  burst.push({x:b.x,y:b.y,vx:(b.x-boss.x)*.08,vy:(b.y-boss.y)*.08,life:1,hue:boss.hue,r:6+Math.random()*8});
  if(boss.hp<=0){
    const bx=boss.x, by=boss.y, phase=boss.phase, fast=(performance.now()-fightStarted)<4000;
    boss=null;
    if(phase===1){ gainXP(5); if(fast) spawnBoss(2); else startSuperNova(bx,by); }
    else if(phase===2){ gainXP(5); if(fast) spawnBoss(3); else startSuperNova(bx,by); }
    else { gainXP(15); if(fast) gainXP(5); startSuperNova(bx,by); }
  }
  return true;
}
function newBit(x,y,state){
  const kinds=activeToys(); if(!kinds.length && state!=="eject") return null;
  return {kind:kinds.length?pick(kinds):"mushrooms",x:x??Math.random()*bg.width,y:y??-30,v:.45+Math.random()*.7,drift:(Math.random()-.5)*.25,vx:0,vy:0,s:14+Math.random()*18,rot:Math.random()*6.28,spin:(Math.random()-.5)*.03,hue:Math.random()*360,state:state||"fall",ang:0};
}
function spawnBit(){ const b=newBit(); if(b) bits.push(b); }
function drawToy(c,b){
  c.save(); c.translate(b.x,b.y); c.rotate(b.rot);
  const s=b.s; c.fillStyle=`hsl(${b.hue},85%,65%)`; c.strokeStyle=`hsl(${b.hue},90%,80%)`; c.lineWidth=1.4;
  if(b.kind==="mushrooms"){ c.fillStyle=b.nasty?"#3a1020":"#f3e2b8"; c.fillRect(-s*.1,0,s*.2,s*.55); c.fillStyle=b.nasty?(b.phase===3?"#c44bff":"#ff2a4a"):`hsl(${b.hue},80%,58%)`; c.beginPath(); c.ellipse(0,0,s*.42,s*.26,0,0,7); c.fill(); c.fillStyle="#fff"; c.beginPath(); c.arc(-s*.12,-s*.04,s*.07,0,7); c.fill(); if(b.nasty){ c.fillStyle="#111"; c.beginPath(); c.arc(-s*.1,-s*.02,s*.05,0,7); c.fill(); c.beginPath(); c.arc(s*.1,-s*.02,s*.05,0,7); c.fill(); } }
  else if(b.kind==="stars"){ c.beginPath(); for(let i=0;i<5;i++){const a=-Math.PI/2+i*1.2566; c.lineTo(Math.cos(a)*s*.5,Math.sin(a)*s*.5); c.lineTo(Math.cos(a+.628)*s*.2,Math.sin(a+.628)*s*.2);} c.closePath(); c.fill(); }
  else if(b.kind==="moons"){ c.beginPath(); c.arc(0,0,s*.38,0,7); c.fill(); c.globalCompositeOperation="destination-out"; c.beginPath(); c.arc(s*.16,-s*.08,s*.3,0,7); c.fill(); c.globalCompositeOperation="source-over"; }
  else if(b.kind==="turtles"){ c.fillStyle=`hsl(${b.hue},70%,42%)`; c.beginPath(); c.ellipse(0,0,s*.34,s*.26,0,0,7); c.fill(); c.fillStyle=`hsl(${b.hue},80%,58%)`; c.beginPath(); c.arc(-s*.28,-s*.02,s*.12,0,7); c.fill(); for(let i=-1;i<=1;i+=2){ c.beginPath(); c.ellipse(i*s*.2,s*.18,s*.1,s*.07,0,0,7); c.fill(); } c.fillStyle="#111"; c.beginPath(); c.arc(-s*.32,-s*.04,s*.03,0,7); c.fill(); }
  else if(b.kind==="skulls"){ c.beginPath(); c.arc(0,-s*.05,s*.28,0,7); c.fill(); c.fillRect(-s*.18,s*.05,s*.36,s*.16); c.fillStyle="#14010c"; c.beginPath(); c.arc(-s*.09,-s*.06,s*.07,0,7); c.fill(); c.beginPath(); c.arc(s*.09,-s*.06,s*.07,0,7); c.fill(); }
  else if(b.kind==="hearts"){ c.beginPath(); c.moveTo(0,s*.28); c.bezierCurveTo(-s*.5,-s*.05,-s*.18,-s*.4,0,-s*.12); c.bezierCurveTo(s*.18,-s*.4,s*.5,-s*.05,0,s*.28); c.fill(); }
  else if(b.kind==="flowers"){ for(let i=0;i<6;i++){ c.beginPath(); c.ellipse(Math.cos(i)*s*.18,Math.sin(i)*s*.18,s*.12,s*.18,i,0,7); c.fill(); } c.fillStyle="#fff59a"; c.beginPath(); c.arc(0,0,s*.1,0,7); c.fill(); }
  else if(b.kind==="butterflies"){ c.beginPath(); c.ellipse(-s*.18,0,s*.2,s*.28,-.4,0,7); c.ellipse(s*.18,0,s*.2,s*.28,.4,0,7); c.fill(); }
  else if(b.kind==="aliens"){ c.beginPath(); c.ellipse(0,0,s*.28,s*.36,0,0,7); c.fill(); c.fillStyle="#111"; c.beginPath(); c.ellipse(-s*.1,0,s*.08,s*.14,-.3,0,7); c.fill(); c.beginPath(); c.ellipse(s*.1,0,s*.08,s*.14,.3,0,7); c.fill(); }
  else if(b.kind==="frogs"){ c.beginPath(); c.ellipse(0,s*.05,s*.32,s*.24,0,0,7); c.fill(); c.beginPath(); c.arc(-s*.12,-s*.1,s*.12,0,7); c.fill(); c.beginPath(); c.arc(s*.12,-s*.1,s*.12,0,7); c.fill(); c.fillStyle="#111"; c.beginPath(); c.arc(-s*.12,-s*.1,s*.04,0,7); c.fill(); c.beginPath(); c.arc(s*.12,-s*.1,s*.04,0,7); c.fill(); }
  else if(b.kind==="cats"){ c.beginPath(); c.arc(0,0,s*.28,0,7); c.fill(); c.beginPath(); c.moveTo(-s*.22,-s*.1); c.lineTo(-s*.08,-s*.42); c.lineTo(0,-s*.12); c.fill(); c.beginPath(); c.moveTo(s*.22,-s*.1); c.lineTo(s*.08,-s*.42); c.lineTo(0,-s*.12); c.fill(); c.fillStyle="#111"; c.beginPath(); c.arc(-s*.08,0,s*.04,0,7); c.fill(); c.beginPath(); c.arc(s*.08,0,s*.04,0,7); c.fill(); }
  else if(b.kind==="crystals"){ c.beginPath(); c.moveTo(0,-s*.45); c.lineTo(s*.22,0); c.lineTo(0,s*.4); c.lineTo(-s*.22,0); c.closePath(); c.fill(); }
  else if(b.kind==="planets"){ c.beginPath(); c.arc(0,0,s*.28,0,7); c.fill(); c.strokeStyle="#fff"; c.beginPath(); c.ellipse(0,0,s*.42,s*.12,.4,0,7); c.stroke(); }
  else if(b.kind==="clouds"){ c.beginPath(); c.arc(-s*.16,0,s*.16,0,7); c.arc(0,-s*.08,s*.2,0,7); c.arc(s*.16,0,s*.16,0,7); c.fill(); }
  else if(b.kind==="dice"){ c.fillRect(-s*.22,-s*.22,s*.44,s*.44); c.fillStyle="#111"; c.beginPath(); c.arc(0,0,s*.05,0,7); c.fill(); }
  else if(b.kind==="peace"){ c.beginPath(); c.arc(0,0,s*.32,0,7); c.stroke(); c.beginPath(); c.moveTo(0,-s*.32); c.lineTo(0,s*.32); c.moveTo(0,0); c.lineTo(-s*.22,s*.2); c.moveTo(0,0); c.lineTo(s*.22,s*.2); c.stroke(); }
  else { c.beginPath(); c.moveTo(0,-s*.4); c.lineTo(s*.08,-s*.08); c.lineTo(s*.4,0); c.lineTo(s*.08,s*.08); c.lineTo(0,s*.4); c.lineTo(-s*.08,s*.08); c.lineTo(-s*.4,0); c.lineTo(-s*.08,-s*.08); c.closePath(); c.fill(); }
  c.restore();
}
function drawSquid(){
  step++;
  const radius=(17+6*Math.sin(step/10))*squidScale;
  jetAng=Math.atan2(mouse.y-mouse.py,mouse.x-mouse.px);
  if(!isFinite(jetAng)||Math.hypot(mouse.x-mouse.px,mouse.y-mouse.py)<1) jetAng=step*0.03;
  ctx.save();
  squid.forEach((arm,ai)=>{
    const ang=2*Math.PI*ai/ARM_N+step*0.004;
    let tx=mouse.x+radius*Math.cos(ang), ty=mouse.y+radius*Math.sin(ang);
    arm.forEach((p)=>{
      const dx=p.x-tx, dy=p.y-ty, d=Math.hypot(dx,dy)||1, stick=5.4*squidScale;
      p.x=tx+dx/d*stick; p.y=ty+dy/d*stick+0.35;
      ctx.strokeStyle="#000"; ctx.lineWidth=Math.max(3.2,p.r*0.9*squidScale);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*squidScale,0,7); ctx.stroke();
      ctx.strokeStyle=`hsla(${170+ai*12},100%,65%,.4)`; ctx.lineWidth=Math.max(1.4,p.r*0.42*squidScale);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*squidScale,0,7); ctx.stroke();
      ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(1.6,p.r*0.5*squidScale);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*squidScale*0.72,0,7); ctx.stroke();
      tx=p.x; ty=p.y;
    });
  });
  ctx.restore();
}
function tickBits(){
  const dens = +(document.getElementById("density")||{}).value || 0;
  if (dens <= 0) bits = bits.filter(b => b.state !== "fall");
  else if (activeToys().length) {
    const need = dens - bits.length;
    const burstN = Math.min(18, Math.max(0, need));
    for (let i=0;i<burstN;i++) spawnBit();
  }
  const capture=40+20*squidScale;
  bits.forEach(b=>{
    const dx=b.x-mouse.x, dy=b.y-mouse.y, dist=Math.hypot(dx,dy);
    if(b.state==="fall"){ b.y+=b.v; b.x+=b.drift; b.rot+=b.spin; if(dist<capture){ b.state="suck"; b.ang=Math.atan2(dy,dx);} }
    else if(b.state==="suck"){
      b.ang+=0.085; const nd=Math.max(0,dist-0.55); b.x=mouse.x+Math.cos(b.ang)*nd; b.y=mouse.y+Math.sin(b.ang)*nd; b.s=Math.max(6,b.s*0.995); b.rot+=0.08;
      if(nd<8*squidScale){
        growFromEat(); b.state="eject";
        if(zenMode&&boss){ const ang=Math.atan2(boss.y-mouse.y,boss.x-mouse.x); const power=20+Math.random()*8; b.vx=Math.cos(ang)*power; b.vy=Math.sin(ang)*power; b.s=12; }
        else { const side=Math.random()<0.5?0:Math.PI, spd=11+Math.random()*7; b.vx=Math.cos(jetAng+side)*spd; b.vy=Math.sin(jetAng+side)*spd; b.s=8; }
      }
    } else if(b.state==="eject"){
      if(zenMode){ b.vx*=1.015; b.vy*=1.015; }
      b.x+=b.vx; b.y+=b.vy; b.vx*=zenMode?0.999:0.992; b.vy*=zenMode?0.999:0.992; b.s=Math.min(22,b.s*1.03); b.rot+=0.12;
      if(zenMode&&hitBoss(b)) Object.assign(b,newBit(Math.random()*bg.width,-30,"fall")||b);
      else if(dist>(zenMode?420:170)){ b.state="fall"; b.v=.5+Math.random()*.4; b.drift=b.vx*0.08; }
    }
    if(b.y>bg.height+50||b.x<-60||b.x>bg.width+60) Object.assign(b,newBit(Math.random()*bg.width,-30,"fall"));
  });
  burst=burst.filter(p=>p.life>0);
  burst.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=0.98; p.vy*=0.98; p.life-=0.012; });
}
(function loopSky(){
  ctx.clearRect(0,0,bg.width,bg.height); tickBits(); bits.forEach(b=>drawToy(ctx,b));
  burst.forEach(p=>{ ctx.globalCompositeOperation="lighter"; ctx.fillStyle=`hsla(${p.hue},100%,60%,${p.life})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+p.life),0,7); ctx.fill(); ctx.globalCompositeOperation="source-over"; });
  if(zenMode&&boss){ boss.rot+=boss.spin; if(boss.hurt>0) boss.hurt--; drawToy(ctx,boss); ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(boss.x-60, boss.y-boss.s*0.62, 120, 8); ctx.fillStyle=boss.hurt?"#ff5d8f":"#7cff3a"; ctx.fillRect(boss.x-60, boss.y-boss.s*0.62, 120*(boss.hp/boss.maxHp), 8); }
  if(novaFX>0){ novaFX=Math.min(1.2,novaFX+0.035); const g=ctx.createRadialGradient(innerWidth/2,innerHeight/2,10,innerWidth/2,innerHeight/2,Math.max(innerWidth,innerHeight)*novaFX); g.addColorStop(0,`hsla(${(step*8)%360},100%,70%,.85)`); g.addColorStop(.35,`hsla(${(step*8+80)%360},100%,60%,.55)`); g.addColorStop(.7,`hsla(${(step*8+160)%360},100%,50%,.28)`); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=g; ctx.fillRect(0,0,bg.width,bg.height); ctx.globalCompositeOperation="source-over"; if(novaFX>1.15) novaFX=0; }
  drawSquid(); requestAnimationFrame(loopSky);
})();
const fmt = n => n.toLocaleString("en-US",{style:"currency",currency:"USD"});
function fmtAxisTime(t, tf){
  const d = new Date(t);
  if (tf==="1d" || tf==="1w") return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  if (tf==="1h" || tf==="2h" || tf==="4h") return d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric"});
  return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}
const slots = GROUPS.map((g,id) => ({id, title:g.title, names:g.names, symbol:g.names[0][0], tf:"30m", allBars:[], price:0, prev:0, live:false, view:70, key:"", hover:null, layout:null, showPx:0}));
document.getElementById("grid").innerHTML = slots.map(s=>`
  <section class="card" id="card-${s.id}">
    <canvas id="cv-${s.id}"></canvas>
    <div class="meta"><div>
      <div class="group-name">${s.title}</div>
      <div class="pickers">
        <select id="in-${s.id}">${s.names.map(([sym,name])=>`<option value="${sym}">${sym} — ${name}</option>`).join("")}</select>
        <select id="tf-${s.id}">${TFS.map(t=>`<option value="${t.id}" ${t.id==="30m"?"selected":""}>${t.id}</option>`).join("")}</select>
        <button type="button" data-fs="${s.id}">full screen</button>
      </div></div>
      <div><div class="px" id="px-${s.id}">${s.symbol}</div><div class="chg flat" id="chg-${s.id}"></div><div class="note" id="note-${s.id}"></div></div>
    </div>
  </section>`).join("");
function isChartFs(id){ return document.fullscreenElement && document.fullscreenElement.id==="card-"+id; }
function visibleBars(slot){ const src=slot.allBars||[]; const n=isChartFs(slot.id)?slot.view:Math.min(70,src.length); return src.slice(-Math.max(12,Math.min(src.length||12,n))); }
function sizeCanvases(){ slots.forEach(s=>{ const c=document.getElementById("cv-"+s.id), r=c.getBoundingClientRect();
  const w=Math.max(240,Math.floor(r.width*devicePixelRatio)), h=Math.max(140,Math.floor(r.height*devicePixelRatio));
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } }); }
addEventListener("resize", sizeCanvases); addEventListener("fullscreenchange", sizeCanvases);
function aggregate(bars,n){ const out=[]; for(let i=0;i<bars.length;i+=n){ const ch=bars.slice(i,i+n); if(!ch.length) continue;
  out.push({t:ch[0].t, open:ch[0].open, close:ch.at(-1).close, high:Math.max(...ch.map(b=>b.high)), low:Math.min(...ch.map(b=>b.low))}); } return out; }
function mergeBars(oldB,newB){ if(!oldB.length) return newB; const map=new Map(oldB.map(b=>[b.t,{...b}])); newB.forEach(b=>map.set(b.t,b)); return [...map.values()].sort((a,c)=>a.t-c.t); }
function tfMs(id){ return ({ "1m":6e4,"5m":3e5,"10m":6e5,"15m":9e5,"30m":18e5,"1h":36e5,"2h":72e5,"4h":144e5,"1d":864e5,"1w":6048e5 })[id] || 18e5; }
function endpoints(symbol, interval, range){ return [`https://trippy-quote.j-bradturner.workers.dev/?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}&range=${encodeURIComponent(range)}`]; }
async function fetchBars(symbol,tfId){
  const tf=TFS.find(t=>t.id===tfId)||TFS[4];
  for(const url of endpoints(symbol,tf.interval,tf.range)){
    try{
      const res=await fetch(url,{cache:"no-store"}); if(!res.ok) continue;
      const json=await res.json(); const r=json.chart&&json.chart.result&&json.chart.result[0]; if(!r) continue;
      const q=r.indicators.quote[0], bars=[];
      for(let i=0;i<r.timestamp.length;i++){
        if([q.open[i],q.close[i],q.high[i],q.low[i]].some(v=>v==null)) continue;
        bars.push({t:r.timestamp[i]*1000, open:q.open[i], high:q.high[i], low:q.low[i], close:q.close[i]});
      }
      if(bars.length<6) continue;
      const used=tf.group?aggregate(bars,tf.group):bars;
      return { bars:used, price:r.meta.regularMarketPrice??used.at(-1).close, prev:r.meta.chartPreviousClose??used.at(-2)?.close??used[0].open };
    }catch(e){}
  }
  throw new Error("no feed");
}
function applyLive(slot, price){
  if (!price || !slot.allBars.length) return;
  const last = slot.allBars.at(-1), bucket = tfMs(slot.tf), now = Date.now();
  if (now - last.t >= bucket * 0.98) slot.allBars.push({ t: last.t + bucket, open: last.close, high: Math.max(last.close, price), low: Math.min(last.close, price), close: price });
  else { last.close = price; last.high = Math.max(last.high, price); last.low = Math.min(last.low, price); }
  slot.price = price; if (slot.showPx == null || slot.showPx === 0) slot.showPx = price;
}
function drawChart(slot){
  const canvas=document.getElementById("cv-"+slot.id), c=canvas.getContext("2d");
  const w=canvas.width,h=canvas.height; c.clearRect(0,0,w,h);
  const bars=visibleBars(slot); if(!bars.length) return;
  if (slot.showPx && slot.price) slot.showPx += (slot.price - slot.showPx) * 0.18;
  const liveBars = bars.map((b,i) => i===bars.length-1 && slot.showPx ? {...b, close:slot.showPx, high:Math.max(b.high,slot.showPx), low:Math.min(b.low,slot.showPx)} : b);
  const padL=64*devicePixelRatio,padR=12*devicePixelRatio,padT=16*devicePixelRatio,padB=30*devicePixelRatio;
  let min=Math.min(...liveBars.map(b=>b.low)), max=Math.max(...liveBars.map(b=>b.high)); if(max===min){max+=1;min-=1;}
  const span=max-min, plotH=h-padT-padB, gap=(w-padL-padR)/liveBars.length, bodyW=Math.max(3,gap*.62);
  const yOf=px=>padT+(max-px)/span*plotH; slot.layout={padL,gap};
  c.strokeStyle="rgba(180,140,255,.16)"; c.lineWidth=devicePixelRatio;
  for(let i=0;i<5;i++){ const y=padT+(plotH/4)*i; c.beginPath(); c.moveTo(padL,y); c.lineTo(w-padR,y); c.stroke();
    c.fillStyle="rgba(220,200,255,.75)"; c.font=`${11*devicePixelRatio}px Trebuchet MS`; c.fillText((max-span/4*i).toFixed(2),6*devicePixelRatio,y+4); }
  liveBars.forEach((b,i)=>{
    const x=padL+i*gap+gap/2, up=b.close>=b.open, col=up?"#7cff9a":"#ff5d9a";
    c.strokeStyle=col; c.shadowColor=up?"rgba(80,255,160,.3)":"rgba(255,70,160,.3)"; c.shadowBlur=((i===liveBars.length-1)?12:7)*devicePixelRatio;
    c.beginPath(); c.moveTo(x,yOf(b.high)); c.lineTo(x,yOf(b.low)); c.stroke();
    const top=yOf(Math.max(b.open,b.close)), bot=yOf(Math.min(b.open,b.close));
    c.fillStyle=col; c.fillRect(x-bodyW/2,top,bodyW,Math.max(2,bot-top)); c.shadowBlur=0;
  });
  const ticks = Math.min(5, liveBars.length);
  c.fillStyle="rgba(220,200,255,.82)"; c.font=`${10*devicePixelRatio}px Trebuchet MS`; c.textAlign="center";
  for(let i=0;i<ticks;i++){
    const idx = ticks===1 ? 0 : Math.round(i*(liveBars.length-1)/(ticks-1));
    const b = liveBars[idx]; if(!b||!b.t) continue;
    c.fillText(fmtAxisTime(b.t, slot.tf), padL+idx*gap+gap/2, h-8*devicePixelRatio);
  }
  c.textAlign="left";
}
function paintMeta(slot){
  const change=slot.price-slot.prev, pct=slot.prev?(change/slot.prev)*100:0;
  document.getElementById("px-"+slot.id).textContent=`${slot.symbol}  ${fmt(slot.price||0)}`;
  const chg=document.getElementById("chg-"+slot.id), sign=change>=0?"+":"";
  chg.textContent=slot.price?`${sign}${change.toFixed(2)}  (${sign}${pct.toFixed(2)}%)`:"";
  chg.className="chg "+(pct>0.01?"up":pct<-0.01?"down":"flat");
  document.getElementById("note-"+slot.id).textContent=slot.live?`${slot.tf} • live last candle`: `${slot.tf} • no live feed`;
}
function clock(){ document.getElementById("status").textContent = `${new Date().toLocaleTimeString()}   eaten ${eaten%15}/15  size ${(squidScale*100).toFixed(0)}%`; }
async function loadSlot(i, forceReset=false){
  const symbol=document.getElementById("in-"+i).value, tf=document.getElementById("tf-"+i).value, key=symbol+"|"+tf;
  try{
    const data=await fetchBars(symbol,tf);
    slots[i].allBars=(forceReset||slots[i].key!==key||!slots[i].allBars.length)?data.bars:mergeBars(slots[i].allBars,data.bars);
    Object.assign(slots[i],{symbol,tf,key,price:data.price,prev:data.prev,live:true});
    applyLive(slots[i], data.price); paintMeta(slots[i]);
  }catch{ Object.assign(slots[i],{symbol,tf,live:false}); if(forceReset) slots[i].allBars=[]; paintMeta(slots[i]); }
}
async function tickLive(){ await Promise.all(slots.map((_,i)=>loadSlot(i,false))); }
async function boot(reset=false){ clock(); sizeCanvases(); await Promise.all(slots.map((_,i)=>loadSlot(i,reset))); }
slots.forEach((_,i)=>{
  document.getElementById("in-"+i).addEventListener("change",()=>loadSlot(i,true));
  document.getElementById("tf-"+i).addEventListener("change",()=>loadSlot(i,true));
  document.querySelector(`[data-fs="${i}"]`).addEventListener("click", async()=>{
    const card=document.getElementById("card-"+i);
    if(document.fullscreenElement===card) await document.exitFullscreen(); else await card.requestFullscreen();
  });
});
document.getElementById("density").addEventListener("input", e => { document.getElementById("densityVal").textContent = e.target.value; });
function loop(){ sizeCanvases(); slots.forEach(drawChart); requestAnimationFrame(loop); }
document.getElementById("fullscreen").addEventListener("click", async()=>{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen();
});
document.getElementById("corner").addEventListener("click", ()=>{
  document.body.classList.toggle("corner");
  document.getElementById("corner").textContent = document.body.classList.contains("corner") ? "charts full" : "charts corner";
  sizeCanvases();
});
document.getElementById("zen").addEventListener("click", ()=>{
  zenMode = !zenMode;
  document.body.classList.toggle("zen", zenMode);
  document.getElementById("zen").textContent = zenMode ? "show everything" : "hide everything";
  if (zenMode) spawnBoss(1); else boss = null;
});
boot(true); loop(); clock();
setInterval(clock,1000);
setInterval(tickLive, 4000);
</script>
