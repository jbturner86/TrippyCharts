<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrippyCharts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height:100%; color:#f4ecff; font-family:"Trebuchet MS","Segoe UI",sans-serif; background:#07010e; overflow:hidden; cursor:none; }
    button, select, .chip, input { cursor:pointer; }
    #sky { position:fixed; inset:0; z-index:0; pointer-events:none;
      background: radial-gradient(ellipse at 12% 8%, rgba(255,60,180,.16), transparent 40%),
                  linear-gradient(180deg,#12061c 0%,#07010e 60%,#0b0714 100%); }
    #sky canvas { width:100%; height:100%; display:block; }
    .wrap { position:relative; z-index:1; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
    header { text-align:center; padding:10px 12px 4px; }
    .title-wrap { position:relative; display:inline-block; }
    h1 {
      position:relative; z-index:2;
      font-size:clamp(1.7rem,5.2vw,3.15rem); letter-spacing:.18em; text-transform:uppercase; line-height:1;
      background:linear-gradient(90deg,#7cff3a,#fff,#c44bff,#ff5d8f,#7cff3a); background-size:220% auto;
      -webkit-background-clip:text; background-clip:text; color:transparent; animation:sheen 7s linear infinite;
      filter:drop-shadow(0 0 10px rgba(196,75,255,.35));
    }
    .melt {
      position:absolute; left:0; right:0; top:62%; z-index:1; pointer-events:none;
      font-size:clamp(1.7rem,5.2vw,3.15rem); letter-spacing:.18em; text-transform:uppercase; line-height:1;
      font-family:inherit; font-weight:bold; text-align:center;
      background:linear-gradient(180deg,#7cff3a 0%,#c44bff 38%,#ff5d8f 70%, transparent 100%);
      background-size:100% 220%;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:drip 3.8s ease-in-out infinite;
      opacity:.78; filter:blur(.4px);
      mask-image:linear-gradient(180deg,#000 0%,#000 18%,transparent 92%);
      -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 18%,transparent 92%);
    }
    .drips { position:absolute; left:8%; right:8%; top:88%; height:42px; pointer-events:none; z-index:0; }
    .drips span {
      position:absolute; top:0; width:7px; border-radius:0 0 20px 20px;
      background:linear-gradient(180deg, rgba(196,75,255,.95), rgba(255,93,143,.15) 70%, transparent);
      animation:drop 2.6s ease-in infinite; opacity:.85;
    }
    .drips span:nth-child(1){ left:8%; height:18px; animation-delay:0s; background:linear-gradient(180deg,#7cff3a, transparent); }
    .drips span:nth-child(2){ left:22%; height:28px; animation-delay:.4s; }
    .drips span:nth-child(3){ left:39%; height:16px; animation-delay:.9s; background:linear-gradient(180deg,#fff, transparent); }
    .drips span:nth-child(4){ left:55%; height:32px; animation-delay:.2s; }
    .drips span:nth-child(5){ left:71%; height:20px; animation-delay:1.1s; background:linear-gradient(180deg,#ff5d8f, transparent); }
    .drips span:nth-child(6){ left:86%; height:26px; animation-delay:.6s; }
    @keyframes sheen { to { background-position:220% center; } }
    @keyframes drip { 0%,100%{ background-position:50% 0%; transform:translateY(0) scaleY(1);} 50%{ background-position:50% 80%; transform:translateY(7px) scaleY(1.18);} }
    @keyframes drop { 0%{ transform:translateY(-4px) scaleY(.4); opacity:.95;} 70%{ opacity:.55;} 100%{ transform:translateY(28px) scaleY(1.4); opacity:0;} }
    .status { margin-top:4px; color:#cbb6ff; font-size:.8rem; }
    .board {
      flex:1 1 auto; min-height:0; display:grid;
      grid-template-columns: minmax(132px,16%) minmax(0,1fr) minmax(132px,16%);
      align-items:stretch; gap:8px; padding:0 8px 8px;
    }
    .toys-col {
      display:flex; flex-direction:column; justify-content:space-evenly; align-items:stretch;
      gap:6px; min-height:0; overflow:auto;
    }
    .chip { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
      border-radius:999px; padding:6px 10px; font-size:.72rem; }
    .chip input { width:15px; height:15px; accent-color:#c44bff; }
    .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:2px 0 4px; }
    button { background:rgba(255,255,255,.06); color:#efe6ff; border:1px solid rgba(255,255,255,.25); border-radius:999px;
      padding:6px 11px; letter-spacing:.08em; text-transform:uppercase; font-size:.65rem; }
    button.on { background:rgba(196,75,255,.28); border-color:#c44bff; }
    .stage {
      min-height:0; display:grid;
      grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap:12px; width:100%; height:100%;
      transition: opacity .25s;
    }
    .stage.hide { display:none; }
    .board.left { grid-template-columns: 0 minmax(0,1fr) minmax(132px,28%); }
    .board.right { grid-template-columns: minmax(132px,28%) minmax(0,1fr) 0; }
    .board.left .toys-left, .board.right .toys-right { display:none; }
    .card { min-height:0; border-radius:16px; background:rgba(10,6,20,.46); border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(3px); overflow:hidden; display:flex; flex-direction:column; }
    .card canvas { display:block; width:100%; flex:1 1 auto; min-height:0; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:space-between; padding:7px 9px 9px; }
    .group-name { font-size:1rem; letter-spacing:.08em; text-transform:uppercase; color:#efe6ff; opacity:1; margin-bottom:5px; font-weight:700; text-shadow:0 0 10px rgba(196,75,255,.35); }
    .pickers { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    select { padding:5px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(18,8,28,.92); color:#fff; font-size:.75rem; }
    .px { font-variant-numeric:tabular-nums; font-size:.92rem; }
    .chg.up { color:#7cff3a; } .chg.down { color:#ff5d8f; } .chg.flat { color:#d7c7ff; }
    .note { font-size:.62rem; color:#b9a6dd; }
    .zoom { display:none; gap:5px; }
    .card:fullscreen .zoom, .card:-webkit-full-screen .zoom { display:flex; }
    .card:fullscreen, .card:-webkit-full-screen { background:rgba(8,4,16,.86); border-radius:0; }
    :fullscreen .stage, :-webkit-full-screen .stage { padding:8px 16px 12px; gap:16px; }
    @media (max-width:900px) {
      html,body { overflow:auto; cursor:auto; }
      .wrap { height:auto; min-height:100dvh; overflow:visible; }
      header { padding-bottom:8px; }
      h1, .melt { font-size:clamp(1.45rem,9vw,2.3rem); letter-spacing:.12em; }
      .board, .board.left, .board.right {
        display:flex; flex-direction:column; height:auto; grid-template-columns:none;
      }
      .toys-col, .board.left .toys-left, .board.right .toys-right {
        display:flex; flex-direction:row; flex-wrap:wrap; justify-content:center;
        max-height:none; overflow:visible;
      }
      .stage, .stage.left, .stage.right { grid-template-columns:1fr; grid-template-rows:none; height:auto; }
      .card { min-height:280px; }
      .card canvas { height:230px; flex:none; }
      .actions { position:sticky; bottom:0; background:rgba(7,1,14,.86); padding:8px; z-index:5; }
      button { font-size:.7rem; padding:8px 12px; }
      .group-name { font-size:.92rem; }
    }
  </style>
</head>
<body>
  <div id="sky"><canvas id="bg"></canvas></div>
  <div class="wrap">
    <header>
      <div class="title-wrap">
        <h1>TrippyCharts</h1>
        <div class="melt">TrippyCharts</div>
        <div class="drips" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <p class="status" id="status"></p>
    </header>
    <div class="actions">
      <button type="button" id="fullscreen">page full screen</button>
      <button type="button" data-dock="left">charts left</button>
      <button type="button" data-dock="center" class="on">charts middle</button>
      <button type="button" data-dock="right">charts right</button>
      <button type="button" id="toggleCharts">hide charts</button>
    </div>
    <div class="board center" id="board">
      <div class="controls toys-col toys-left" id="toysLeft"></div>
      <main class="stage" id="grid"></main>
      <div class="controls toys-col toys-right" id="toysRight"></div>
    </div>
  </div>
<script>
const TOYS = [
  ["mushrooms","Mushrooms",true],["stars","Stars"],["moons","Moons"],["leaves","Cannabis leaves"],
  ["skulls","Skulls"],["hearts","Hearts"],["flowers","Flowers"],["butterflies","Butterflies"],
  ["aliens","Aliens"],["frogs","Frogs"],["cats","Cats"],["crystals","Crystals"],
  ["planets","Planets"],["clouds","Clouds"],["dice","Dice"],["peace","Peace signs"],["sparkles","Sparkles"]
];
const TFS = [
  {id:"1m",interval:"1m",range:"1d"},{id:"5m",interval:"5m",range:"5d"},{id:"10m",interval:"5m",range:"5d",group:2},
  {id:"15m",interval:"15m",range:"5d"},{id:"30m",interval:"30m",range:"5d"},{id:"1h",interval:"60m",range:"1mo"},
  {id:"2h",interval:"60m",range:"3mo",group:2},{id:"4h",interval:"60m",range:"3mo",group:4},
  {id:"1d",interval:"1d",range:"6mo"},{id:"1w",interval:"1wk",range:"2y"}
];
const GROUPS = [
  {title:"Magnificent 7 / Mega-cap Tech", names:[["NVDA","Nvidia"],["AAPL","Apple"],["MSFT","Microsoft"],["AMZN","Amazon"],["GOOGL","Alphabet"],["META","Meta"],["TSLA","Tesla"]]},
  {title:"Semis & AI Infrastructure", names:[["AVGO","Broadcom"],["AMD","AMD"],["MU","Micron"],["INTC","Intel"],["PLTR","Palantir"],["TSM","TSMC"],["AMAT","Applied Materials"]]},
  {title:"Financials", names:[["JPM","JPMorgan"],["BAC","Bank of America"],["V","Visa"],["MA","Mastercard"],["WFC","Wells Fargo"],["GS","Goldman Sachs"],["MS","Morgan Stanley"],["BLK","BlackRock"],["SCHW","Charles Schwab"],["C","Citigroup"]]},
  {title:"Healthcare", names:[["UNH","UnitedHealth"],["LLY","Eli Lilly"],["JNJ","Johnson & Johnson"],["ABBV","AbbVie"],["MRK","Merck"],["PFE","Pfizer"],["ABT","Abbott"],["TMO","Thermo Fisher"],["AMGN","Amgen"],["ISRG","Intuitive Surgical"]]}
];

const mid = Math.ceil(TOYS.length/2);
document.getElementById("toysLeft").innerHTML = TOYS.slice(0,mid).map(([id,label,on]) =>
  `<label class="chip"><input type="checkbox" data-toy="${id}" ${on?"checked":""}>${label}</label>`).join("");
document.getElementById("toysRight").innerHTML = TOYS.slice(mid).map(([id,label,on]) =>
  `<label class="chip"><input type="checkbox" data-toy="${id}" ${on?"checked":""}>${label}</label>`).join("");
function activeToys(){ return [...document.querySelectorAll("[data-toy]:checked")].map(el => el.dataset.toy); }
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
document.getElementById("board").addEventListener("change", () => {
  const kinds = activeToys();
  bits.forEach(b => { if (kinds.length) b.kind = pick(kinds); });
});

const mouse = { x: innerWidth/2, y: innerHeight/2, px: innerWidth/2, py: innerHeight/2 };
addEventListener("mousemove", e => { mouse.px = mouse.x; mouse.py = mouse.y; mouse.x = e.clientX; mouse.y = e.clientY; });

const bg = document.getElementById("bg"), ctx = bg.getContext("2d");
let bits = [], burst = [], step = 0, jetAng = 0, eaten = 0, squidScale = 1;
const ARM_N = 16, SEG = 16;
const squid = Array.from({length: ARM_N}, () =>
  Array.from({length: SEG}, (_,i) => ({ x: innerWidth/2, y: innerHeight/2, r: Math.max(2, 11 - i*0.55) }))
);
function resizeBg(){ bg.width = innerWidth; bg.height = innerHeight; }
addEventListener("resize", resizeBg); resizeBg();

function nova(){
  for (let i=0;i<120;i++){
    const a = Math.random()*Math.PI*2, sp = 3+Math.random()*14;
    burst.push({ x:mouse.x, y:mouse.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, hue:Math.random()*360, r:2+Math.random()*6 });
  }
  eaten = 0; squidScale = 1;
}
function growFromEat(){
  eaten++;
  if (eaten > 0 && eaten % 15 === 0) {
    squidScale *= 1.05;
    if (squidScale >= 2) nova();
  }
}

function newBit(x, y, state){
  const kinds = activeToys(); if (!kinds.length && state!=="eject") return null;
  return {
    kind: kinds.length ? pick(kinds) : "sparkles",
    x: x ?? Math.random()*bg.width, y: y ?? -30,
    v: .45 + Math.random()*.7, drift: (Math.random()-.5)*.25,
    vx:0, vy:0, s: 14 + Math.random()*18,
    rot: Math.random()*6.28, spin: (Math.random()-.5)*.03,
    hue: Math.random()*360, state: state || "fall", ang: 0
  };
}
function spawnBit(){ const b = newBit(); if (b) bits.push(b); }

function drawToy(c,b){
  c.save(); c.translate(b.x,b.y); c.rotate(b.rot);
  const s=b.s; c.fillStyle=`hsl(${b.hue},85%,65%)`; c.strokeStyle=`hsl(${b.hue},90%,80%)`; c.lineWidth=1.4;
